name: Package CUDA and cuDNN Runtime

# Thin caller: the packaging logic lives in exactly one place -
# SeasonRealms/SeasonONNX/.github/workflows/package-cuda-cudnn-runtime.yml.
# This wrapper keeps the SeasonEngine entry point used to refresh the
# cudacudnn-runtime/win-x64/native drop-in consumed by SeasonStudio's Windows
# packaging, and pins the full profile: include_cudnn=true.
#
# Artifacts produced by the called workflow:
#   - cuda-runtime-dlls            (CUDA runtime DLLs)
#   - cudnn-runtime-dlls           (cuDNN runtime DLLs)
#   - cuda-cudnn-runtime-bundle    (drop-in deployment folder, incl. README.txt)
#   - cuda-cudnn-runtime-metadata  (runtime-manifest.json)

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: "CUDA Toolkit version"
        required: true
        default: "12.8.1"
      cudnn_version:
        description: "cuDNN version"
        required: true
        default: "9.8.0.87"

permissions:
  contents: read

jobs:
  package-runtime:
    uses: SeasonRealms/SeasonONNX/.github/workflows/package-cuda-cudnn-runtime.yml@main
    with:
      cuda_version: ${{ inputs.cuda_version }}
      include_cudnn: true
      cudnn_version: ${{ inputs.cudnn_version }}
